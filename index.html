<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Silver Spoon - Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2D1B4E 0%, #4A1942 40%, #3D1555 70%, #2D1B4E 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(201,169,110,0.06) 0%, transparent 60%);
      animation: shimmer 8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }
    .pattern {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 20% 80%, rgba(201,169,110,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(201,169,110,0.08) 0%, transparent 40%);
      pointer-events: none;
    }
    .corner-decor {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 2px solid rgba(201,169,110,0.25);
      pointer-events: none;
    }
    .corner-decor.top-left {
      top: 30px; left: 30px;
      border-right: none; border-bottom: none;
    }
    .corner-decor.top-right {
      top: 30px; right: 30px;
      border-left: none; border-bottom: none;
    }
    .corner-decor.bottom-left {
      bottom: 30px; left: 30px;
      border-right: none; border-top: none;
    }
    .corner-decor.bottom-right {
      bottom: 30px; right: 30px;
      border-left: none; border-top: none;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 750px;
      position: relative;
      z-index: 1;
    }
    .logo { max-width: 160px; margin-bottom: 25px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 8px;
      font-weight: 400;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 6px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #C9A96E, transparent);
      margin: 16px auto;
    }
    .tagline {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      margin-bottom: 45px;
      line-height: 1.7;
      font-weight: 300;
    }
    .countdown-label {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 18px;
    }
    .countdown {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 50px;
    }
    .countdown-item {
      background: rgba(201,169,110,0.1);
      border: 1px solid rgba(201,169,110,0.3);
      border-radius: 12px;
      padding: 18px 20px;
      min-width: 90px;
      backdrop-filter: blur(10px);
    }
    .countdown-item span:first-child {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #C9A96E;
      line-height: 1.2;
    }
    .countdown-item span:last-child {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
      font-weight: 400;
    }
    .contact-section {
      margin-top: 10px;
    }
    .contact-title {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 16px;
    }
    .contact-item {
      display: inline-block;
      margin: 0 14px 10px 14px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }
    .contact-item:hover { color: #C9A96E; }
    .contact-item svg {
      width: 16px;
      height: 16px;
      vertical-align: middle;
      margin-right: 8px;
      fill: #C9A96E;
    }
    .footer-line {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid rgba(201,169,110,0.15);
    }
    .tagline-bottom {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: rgba(201,169,110,0.6);
      letter-spacing: 1px;
    }
    .copyright {
      margin-top: 12px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
    }
    @media (max-width: 520px) {
      h1 { font-size: 2.2rem; }
      .countdown { gap: 10px; }
      .countdown-item { min-width: 72px; padding: 14px 12px; }
      .countdown-item span:first-child { font-size: 1.8rem; }
      .contact-item { display: block; margin: 8px 0; }
      .corner-decor { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
  <div class="pattern"></div>
  <div class="corner-decor top-left"></div>
  <div class="corner-decor top-right"></div>
  <div class="corner-decor bottom-left"></div>
  <div class="corner-decor bottom-right"></div>

  <div class="container">
    <img class="logo" src="uploads/logo.png" alt="The Silver Spoon">
    <p class="subtitle">Indian &bull; Chinese Restaurant</p>
    <h1>THE SILVER SPOON</h1>
    <div class="divider"></div>
    <p class="tagline">Something extraordinary is being prepared for you.<br>We will be back soon.</p>

    <p class="countdown-label">Opening In</p>
    <div class="countdown">
      <div class="countdown-item"><span id="days">0</span><span>Days</span></div>
      <div class="countdown-item"><span id="hours">0</span><span>Hours</span></div>
      <div class="countdown-item"><span id="minutes">0</span><span>Minutes</span></div>
      <div class="countdown-item"><span id="seconds">0</span><span>Seconds</span></div>
    </div>

    <div class="contact-section">
      <p class="contact-title">Reach Us</p>
      <a class="contact-item" href="tel:‎‎+919471978478">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.01l-2.21 2.21z"/></svg>
        ‎+91 9471 978 478
      </a>
      <a class="contact-item" href="mailto:info@thesilverspoon.org">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        info@thesilverspoon.org
      </a>
    </div>

    <div class="footer-line">
      <p class="tagline-bottom">One Spoon, Endless Flavors</p>
      <p class="copyright">&copy; 2026 The Silver Spoon. All rights reserved.</p>
    </div>
  </div>

  <script>
    (function () {
      var KEY = 'silverspoon_launch';
      var target = localStorage.getItem(KEY);
      if (!target) {
        var d = new Date();
        d.setDate(d.getDate() + 7);
        target = d.getTime().toString();
        localStorage.setItem(KEY, target);
      }
      var end = parseInt(target, 10);
      function update() {
        var now = Date.now();
        var diff = Math.max(0, end - now);
        document.getElementById('days').textContent    = Math.floor(diff / 86400000);
        document.getElementById('hours').textContent   = Math.floor((diff % 86400000) / 3600000);
        document.getElementById('minutes').textContent = Math.floor((diff % 3600000) / 60000);
        document.getElementById('seconds').textContent = Math.floor((diff % 60000) / 1000);
      }
      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
